<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ওয়েবসাইট আপডেট চলমান | KHELO TOPUP</title>
    <!-- Google Fonts for Bengali -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans Bengali', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #1b263b 0%, #0d1b2a 100%);
            overflow: hidden;
            position: relative;
        }

        /* Animated Background Elements */
        .sparkles {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .sparkle {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.3;
            animation: twinkle 3s infinite alternate;
        }

        /* Glassmorphism Card */
        .maintenance-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 50px 40px;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            z-index: 10;
            animation: slideUpFade 1.2s ease-out forwards;
            position: relative;
        }

        /* Diamond Icon Animation */
        .icon-container {
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        .icon-container i {
            font-size: 60px;
            color: #00e5ff;
            text-shadow: 0 0 20px rgba(0, 229, 255, 0.8);
        }

        h1 {
            color: #ffffff;
            font-size: 28px;
            margin-bottom: 15px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        p {
            color: #b0bec5;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* Telegram Button */
        .telegram-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(45deg, #0088cc, #00aaff);
            color: white;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4);
            position: relative;
            overflow: hidden;
        }

        .telegram-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 136, 204, 0.6);
        }

        .telegram-btn i {
            font-size: 20px;
        }

        /* Animations */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        @keyframes slideUpFade {
            0% { 
                opacity: 0;
                transform: translateY(50px);
            }
            100% { 
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes twinkle {
            0% { opacity: 0.1; transform: scale(0.5); }
            100% { opacity: 0.8; transform: scale(1.5); }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .maintenance-card {
                margin: 20px;
                padding: 40px 20px;
            }
            h1 { font-size: 24px; }
            p { font-size: 14px; }
        }
    </style>
</head>
<body>

    <!-- Background Sparkles for Diamond Theme -->
    <div class="sparkles" id="sparkles"></div>

    <div class="maintenance-card">
        <div class="icon-container">
            <i class="fa-solid fa-gem"></i>
        </div>
        <h1>ওয়েবসাইটের আপডেট চলমান!</h1>
        <p>আমরা আমাদের ডায়মন্ডের ওয়েবসাইটটিকে আরও আধুনিক এবং আকর্ষণীয় করতে বর্তমানে কিছু বিশেষ আপডেটের কাজ করছি। গ্রাহকদের আরও উন্নত অভিজ্ঞতা দিতে আমরা খুব শীঘ্রই নতুন রূপে ফিরে আসছি।</p>
        
        <!-- Telegram Link Button -->
        <!-- "https://t.me/khelobuzz_official" এর জায়গায় আপনার টেলিগ্রাম গ্রুপের বা চ্যানেলের লিঙ্কটি দিন -->
        <a href="https://t.me/khelobuzz_official" target="_blank" class="telegram-btn">
            <i class="fa-brands fa-telegram"></i> টেলিগ্রামে যুক্ত হোন
        </a>
    </div>

    <!-- Javascript for Random Sparkles Generator -->
    <script>
        const sparklesContainer = document.getElementById('sparkles');
        const sparklesCount = 50; // স্পার্কল বা তারার সংখ্যা

        for (let i = 0; i < sparklesCount; i++) {
            let sparkle = document.createElement('div');
            sparkle.classList.add('sparkle');
            
            // Random positions
            sparkle.style.left = Math.random() * 100 + 'vw';
            sparkle.style.top = Math.random() * 100 + 'vh';
            
            // Random sizes
            let size = Math.random() * 3 + 1;
            sparkle.style.width = size + 'px';
            sparkle.style.height = size + 'px';
            
            // Random animation delay
            sparkle.style.animationDelay = Math.random() * 3 + 's';
            
            sparklesContainer.appendChild(sparkle);
        }
    </script>

</body>
</html>
